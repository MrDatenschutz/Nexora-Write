<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nexora Write</title>

  <style>

:root{

 --background:#0f172a;
 --surface:#111e35;
 --surface-light:#17263f;

 --accent:#38bdf8;
 --accent-hover:#7dd3fc;

 --text:#e5e7eb;
 --muted:#94a3b8;

 --border:rgba(148,163,184,.15);

}

*{
 box-sizing:border-box;
}

body{

 margin:0;

 font-family:"Segoe UI",sans-serif;

 background:#0f172a;

 background-image:
 radial-gradient(
 ellipse at 50% 0%,
 rgba(14,165,233,.09),
 transparent 55%
 );

 color:var(--text);

 height:100vh;

 display:flex;

 flex-direction:column;

}

#header{

 height:10vh;

 min-height:70px;

 background:#111e35;

 border-bottom:1px solid var(--border);

 display:flex;

 align-items:center;

 justify-content:space-between;

 padding:0 20px;

}

#header-left{

 display:flex;

 align-items:center;

 gap:20px;

}

#app-title{

 font-size:2rem;

 color:var(--accent);

 font-weight:700;

}

#offline-box{

 font-size:.8rem;

 color:var(--muted);

 display:flex;

 align-items:center;

 gap:8px;

}

#offline-box button{

 padding:6px 10px;

 background:#0ea5e9;

 color:#082f49;

 border:none;

 border-radius:8px;

 cursor:pointer;

 font-weight:700;

}

#offline-box button:hover{

 background:var(--accent-hover);

}

#header-right button{

 margin-left:10px;

 padding:10px 16px;

 background:#0ea5e9;

 color:#082f49;

 border:none;

 border-radius:10px;

 font-weight:700;

 cursor:pointer;

 transition:.2s ease;

}

#header-right button:hover{

 background:var(--accent-hover);

}

#main{

 height:90vh;

 display:flex;

 flex-direction:column;

 background:transparent;

 position:relative;

}

#toolbar{

 padding:10px;

 border-bottom:1px solid var(--border);

 background:#111e35;

 display:flex;

 flex-wrap:wrap;

 gap:8px;

}

.tool-btn,
.tool-select{

 background:#17263f;

 border:1px solid var(--border);

 color:var(--text);

 border-radius:8px;

 padding:8px 12px;

 cursor:pointer;

 font-size:.9rem;

}

.tool-btn:hover,
.tool-select:hover{

 border-color:rgba(56,189,248,.4);

}

#editor-wrapper{

 flex:1;

 padding:20px;

 display:flex;

 justify-content:center;

 overflow:auto;

}

.home-btn{

 display:inline-block;

 padding:10px 16px;

 background:#0ea5e9;

 color:#082f49;

 text-decoration:none;

 border-radius:10px;

 font-weight:700;

 transition:.2s ease;

 white-space:nowrap;

}

.home-btn:hover{

 background:#7dd3fc;

 transform:translateY(-1px);

}

#editor{

 width:90%;

 max-width:950px;

 min-height:90%;

 background:#111e35;

 border-radius:16px;

 padding:30px;

 color:var(--text);

 outline:none;

 border:1px solid var(--border);

 font-family:"Calibri","Segoe UI",sans-serif;

 font-size:16px;

 line-height:1.6;

 white-space:pre-wrap;

}

#editor:focus{

 border-color:rgba(56,189,248,.4);

 box-shadow:
 0 0 15px
 rgba(56,189,248,.12);

}

#statusbar{

 position:absolute;

 right:20px;

 bottom:10px;

 font-size:.85rem;

 color:var(--muted);

}

.bottom-actions{

 display:flex;

 justify-content:center;

 gap:10px;

 padding:20px;

}

.back-btn{

 display:inline-block;

 background:#0ea5e9;

 color:#082f49;

 text-decoration:none;

 padding:12px 20px;

 border-radius:10px;

 font-weight:700;

 transition:.2s ease;

}

.back-btn:hover{

 background:var(--accent-hover);

 transform:translateY(-1px);

}

footer{

 text-align:center;

 color:#64748b;

 padding-bottom:20px;

}

</style>
</head>
<body>

  <div id="header">

    <div id="header-left">

    <a
    href="https://mrdatenschutz.github.io/Nexora/index.html"
    class="home-btn">

        <= Startseite

    </a>

    <div id="app-title">

        Nexora Write

    </div>

    <div id="offline-box">
        <span>Offline-Version?</span>
        <button id="offlineDownloadBtn">Download</button>
      </div>
    </div>

    <div id="header-right">
      <button id="uploadBtn">Öffnen (.nxt)</button>
      <button id="saveBtn">Speichern (.nxt)</button>
      <button id="pdfBtn">Export als PDF</button>
    </div>
  </div>

  <div id="main">
    <div id="toolbar">
      <select id="fontSizeSelect" class="tool-select">
        <option value="3">Größe: Standard</option>
        <option value="2">Klein</option>
        <option value="3">Normal</option>
        <option value="4">Groß</option>
        <option value="5">Sehr groß</option>
      </select>

      <button class="tool-btn" data-cmd="bold"><b>F</b></button>
      <button class="tool-btn" data-cmd="italic"><i>K</i></button>
      <button class="tool-btn" data-cmd="underline"><u>U</u></button>

      <button class="tool-btn" data-cmd="insertUnorderedList">• Liste</button>
      <button class="tool-btn" data-cmd="insertOrderedList">1. Liste</button>

      <button class="tool-btn" data-cmd="justifyLeft">Links</button>
      <button class="tool-btn" data-cmd="justifyCenter">Zentriert</button>
      <button class="tool-btn" data-cmd="justifyRight">Rechts</button>

      <button class="tool-btn" data-cmd="undo">↶ Undo</button>
      <button class="tool-btn" data-cmd="redo">↷ Redo</button>
    </div>

    <div id="editor-wrapper">
      <div id="editor" contenteditable="true"></div>
    </div>

    <!-- Wort- & Zeichenanzeige -->
    <div id="statusbar">Wörter: 0 | Zeichen: 0</div>
  </div>

  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    const editor = document.getElementById("editor");
    const saveBtn = document.getElementById("saveBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const pdfBtn = document.getElementById("pdfBtn");
    const fontSizeSelect = document.getElementById("fontSizeSelect");
    const statusbar = document.getElementById("statusbar");

    /* Toolbar Buttons */
    document.querySelectorAll(".tool-btn[data-cmd]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.execCommand(btn.dataset.cmd, false, null);
        editor.focus();
        updateStatus();
      });
    });

    /* Schriftgröße */
    fontSizeSelect.addEventListener("change", () => {
      document.execCommand("fontSize", false, fontSizeSelect.value);
      editor.focus();
      updateStatus();
    });

    /* Statusbar aktualisieren */
    function updateStatus() {
      const text = editor.innerText.trim();

      const words = text.length > 0
        ? text.split(/\s+/).filter(w => w.length > 0).length
        : 0;

      const chars = text.replace(/\s/g, "").length;

      statusbar.textContent = `Wörter: ${words} | Zeichen: ${chars}`;
    }

    editor.addEventListener("input", updateStatus);

    /* Speichern als .nxt */
    saveBtn.addEventListener("click", () => {
      const content = editor.innerHTML;
      const blob = new Blob([content], { type: "text/html;charset=utf-8" });

      let name = prompt("Dateiname:", "Dokument");
      if (!name) return;
      if (!name.toLowerCase().endsWith(".nxt")) name += ".nxt";

      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    /* Öffnen (.nxt) */
    uploadBtn.addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".nxt";

      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          editor.innerHTML = reader.result;
          updateStatus();
        };
        reader.readAsText(file, "UTF-8");
      };

      input.click();
    });

    /* Export als PDF */
    pdfBtn.addEventListener("click", () => {
      const opt = {
        margin: 10,
        filename: "Nexora-Text.pdf",
        image: { type: "jpeg", quality: 1 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
      };

      html2pdf().set(opt).from(editor).save();
    });

    /* Offline ZIP Download */
    document.getElementById("offlineDownloadBtn").addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = "https://github.com/MrDatenschutz/Nexora-Write/raw/main/Nexora_Write_lokal.zip";
      link.download = "Nexora_Write_lokal.zip";
      link.click();
    });
  </script>


© Nexora – Write

</footer>

</body>
</html>
